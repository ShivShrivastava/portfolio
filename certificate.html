<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Viewer</title>
    <style>
        :root {
            --bg0: #060B16;
            --bg1: #0A1326;
            --bg2: #0E1B36;
            --text: #EAF1FF;
            --muted: rgba(234,241,255,.72);
            --accent: #4F7CFF;
            --stroke: rgba(255,255,255,.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
            color: var(--text);
            background: linear-gradient(165deg, var(--bg0), var(--bg1) 55%, var(--bg2));
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: linear-gradient(180deg, rgba(51, 65, 85, 0.75), rgba(71, 85, 105, 0.7));
            border: 1px solid rgba(148, 163, 184, 0.4);
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            text-align: center;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid rgba(148, 163, 184, 0.3);
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
            color: #F1F5F9;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(180deg, rgba(51, 65, 85, 0.9), rgba(30, 41, 59, 0.95));
            border-color: rgba(148, 163, 184, 0.5);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 20px;
            color: var(--text);
        }

        .certificate-image {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-top: 20px;
        }

        .error-message {
            color: #ff6b6b;
            font-size: 18px;
            margin-top: 20px;
        }

        .loading {
            color: var(--muted);
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">← Back to Portfolio</a>
        
        <h1>Certificate Viewer</h1>
        
        <div id="certificate-container">
            <div class="loading">Loading certificate...</div>
        </div>
    </div>

    <script>
        // Get URL parameters
        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // Display certificate
        function displayCertificate() {
            const imageParam = getUrlParameter('img');
            const container = document.getElementById('certificate-container');
            
            if (imageParam) {
                try {
                    // Decode the image name
                    const imageName = decodeURIComponent(imageParam);
                    
                    // Create image element
                    const img = document.createElement('img');
                    img.src = 'assets/' + imageName;
                    img.alt = 'Certificate';
                    img.className = 'certificate-image';
                    
                    // Handle image loading errors
                    img.onerror = function() {
                        container.innerHTML = '<div class="error-message">Certificate not found</div>';
                    };
                    
                    // Clear loading message and add image
                    container.innerHTML = '';
                    container.appendChild(img);
                    
                } catch (error) {
                    container.innerHTML = '<div class="error-message">Certificate not found</div>';
                }
            } else {
                container.innerHTML = '<div class="error-message">Certificate not found</div>';
            }
        }

        // Load certificate when page loads
        window.addEventListener('load', displayCertificate);
    </script>
</body>
</html>
